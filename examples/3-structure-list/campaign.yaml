# ===========================================================================
#  EXAMPLE 3 of 3 -- campaign type 3: structure_list
#
#  "I already have the structures."  Nothing is generated: the files in
#  inputs/seeds/ are read, their composition is DERIVED from the file, and the
#  rows enter the funnel at screen. MatterGen is never invoked, which is why
#  this file has no `generate:` block -- a seeds-only campaign must not have one.
#
#  Use it for: structures from a previous run or another code, experimental
#  CIFs, prototypes built by hand, or a control group for a generative sweep.
#  The seeds here are real: five DFT-relaxed Sm-Fe structures from a finished
#  campaign, including Sm2Fe17 (hR19) and SmFe12 (tI26).
#
#  Start your own from this file:   csp init 3 my-seeds
#
#  How to read it: every line that is not a comment is a live setting, written
#  out even where it equals the default. Where a setting takes one of a fixed
#  set of values, the others are listed beside it as  # a | b | c  (pick ONE).
#  Where a setting takes SEVERAL at once, the comment starts  # several:
#  and shows the comma-separated form, e.g.  [Sm, Nd, Pr]  or  {Sm: Sm_3, Ti: Ti_pv}.
# ===========================================================================

name: example-seeds
machine: machine.yaml            # this folder's copy | orion | generic_slurm | local | any path
workdir: results                 # beside this file; an absolute path puts output elsewhere

# ---------------------------------------------------------------------------
# SOURCE -- the structures you already have
# ---------------------------------------------------------------------------
source:
  - mode: structure_list         # this file's type; `csp init 1|2|3` starts another
    name: seeds                  # stamped on every row; needed once there are 2+ sources
    structure_list:
      # A folder, a glob, or individual files, mixed freely, relative to this
      # file. Read: .vasp .poscar .contcar .cif .xyz .extxyz .res .json and any
      # file named POSCAR or CONTCAR; anything else in a folder is ignored.
      # Every file is parsed by BOTH pymatgen and ASE and the two must agree on
      # the composition.
      paths:
        - inputs/seeds           # several: one per line -- folders, globs (inputs/seeds/*.vasp), files
      relax: true                # true | false  -- false only if already relaxed with THIS MLIP
      dedup: warn                # warn | drop | off  -- warn: never merge curated seeds silently
      max_atoms: 60              # a bigger seed is refused at read time; Sm2Fe17 is 57

# ---------------------------------------------------------------------------
# SCREEN + DEDUP -- where these rows enter
# ---------------------------------------------------------------------------
screen:
  mlip: mattersim                # mattersim | chgnet  -- the same MLIP the hull is built with
  mattersim:
    model: MatterSim-v1.0.0-5M.pth
    fmax: 0.005                  # tighter than a sweep's 0.01: five seeds cost nothing
    max_steps: 1000
  dedup:
    matcher:
      ltol: 0.2
      stol: 0.2
      angle_tol: 5.0
  resources:
    role: gpu                    # gpu | cpu | bigmem | short | short_gpu  (roles in machine.yaml)
    gpus: 1
    time: "04:00:00"

# ---------------------------------------------------------------------------
# REFERENCE -- seeds still need a hull to be measured against
# ---------------------------------------------------------------------------
reference:
  thermo_type: GGA_GGA+U         # GGA_GGA+U | R2SCAN | GGA_GGA+U_R2SCAN  -- PINNED
  energy_scale: raw              # raw | mp_corrected
  mode: recompute                # recompute | mp_energies  -- asked by `csp init`
  energy_source: dft             # dft | mlip | mp  -- which store energy builds the FINAL hull

# ---------------------------------------------------------------------------
# FILTER -- who is worth a VASP job
# ---------------------------------------------------------------------------
filter:
  e_above_hull_max: 0.20         # loose: a seed you chose should not be cut by a sweep's
                                 # cutoff. Set it very large to send every seed to DFT.
  max_per_composition: 10
  spacegroup:
    min_number: 1                # 1 keeps everything -- a P1 seed is still a seed you chose

# ---------------------------------------------------------------------------
# DFT -- the expensive half. INCAR tags and k-points are in recipe.yaml.
# ---------------------------------------------------------------------------
dft:
  recipe: recipe.yaml            # this folder's copy | magnets | any path
  layout: runs                   # runs | stages  (stages only for pre-2026-09-14 campaigns)
  combined_job: true             # true | false  -- every step of a structure in one job
  potcar:
    tree: VASP6.4                # VASP6.4 | VASP5.2
    functional: PBE_64           # the label matching the tree, e.g. PBE_54 for VASP5.2
    overrides: {}                # several: {Sm: Sm_3, Ti: Ti_pv} -- element -> POTCAR symbol
  rare_earth:
    f_treatment: frozen          # frozen | valence  (valence needs ldau)
    magnetic_order: ferro        # ferro | ferri | none  -- ferro matches the shared store
    reconstruct_ms: true         # true | false  -- add the frozen 4f moment back when reporting
  # The magnetic setup is part of the DFT policy the shared reference store was
  # computed with. Change any line below and this campaign's energies no longer
  # sit on the store's hull -- `csp doctor` warns ("reference recipe").
  magnetism:
    mode: ferromagnetic          # ferromagnetic | ferrimagnetic_retm | table | pymatgen | none
    strict: true                 # true | false  -- fail rather than take a default MAGMOM
    table:                       # several: element -> initial moment (muB), added to the mode's table
      As: 0.6                    # the store's own additions: elements its table
      Sb: 0.6                    # lacked, which strict: true would otherwise refuse
      Bi: 0.6
      Au: 0.6
      Ru: 3.0
      In: 0.6
      Se: 0.6
      Te: 0.6
  ldau:
    enabled: false               # true | false
    ldau_type: 2                 # 1 | 2 | 4
    u: {}                        # several: {Sm: 6.0, Nd: 6.0} -- element -> U in eV
    j: {}                        # several: {Sm: 0.0, Nd: 0.0} -- element -> J in eV
  nbands: auto                   # auto, or an integer
  incar_overrides: {}            # several: {NCORE: 8, LREAL: Auto} -- on top of every recipe step
  max_in_flight: 50              # jobs queued at once
  max_concurrent_tasks: 50       # array tasks running at once
  max_cores: 3200                # cores queued + running; 3200 = 50 jobs x 64 ranks. null = no cap
  select:
    rank_by: e_above_hull_mlip   # the order Phase B spends the budget in
    max_total: 5000              # LIFETIME ceiling on DFT jobs
