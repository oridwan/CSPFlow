# ===========================================================================
#  EXAMPLE 2 of 3 -- campaign type 2: composition_list
#
#  "I know which formulas I want."  No enumeration: you give the list, cspflow
#  generates structures for exactly those and nothing else. Same funnel from
#  there on -- generate, screen, dedup, hull, filter, DFT.
#
#  Two ways to give the list, and this example uses BOTH at once:
#    inline `items:`   a handful you are looking at while you edit
#    `from_file:`      a CSV you maintain separately (inputs/compositions.csv)
#  Inline items are read first; a formula in both warns and keeps the inline
#  one. So the file is the list you maintain, the items are today's exceptions.
#
#  Start your own from this file:   csp init 2 my-shortlist
#
#  How to read it: every line that is not a comment is a live setting, written
#  out even where it equals the default. Where a setting takes one of a fixed
#  set of values, the others are listed beside it as  # a | b | c  (pick ONE).
#  Where a setting takes SEVERAL at once, the comment starts  # several:
#  and shows the comma-separated form, e.g.  [Sm, Nd, Pr]  or  {Sm: Sm_3, Ti: Ti_pv}.
# ===========================================================================

name: example-shortlist
machine: machine.yaml            # this folder's copy | orion | generic_slurm | local | any path
workdir: results                 # beside this file; an absolute path puts output elsewhere

# ---------------------------------------------------------------------------
# SOURCE -- what to search
# ---------------------------------------------------------------------------
source:
  - mode: composition_list       # this file's type; `csp init 1|2|3` starts another
    name: shortlist              # stamped on every row; needed once there are 2+ sources
    composition_list:
      # Every field except `formula` is optional and falls back to `defaults`.
      items:                     # several: one "- formula:" entry each
        - formula: SmFe11Ti      # also in the CSV at 120 structures; this entry wins, with a warning
          z: [1, 1]              # [min, max]
          max_atoms: 26          # z * 13 atoms
          n_structures:
            mode: fixed          # fixed | per_atom
            count: 150           # spend more on the phase you care most about
        - formula: Sm3Fe29Ti2    # not in the CSV; being tried for the first time
          z: [1, 1]              # 34 atoms/f.u.; one unit is already a big cell
          n_structures:
            mode: fixed
            count: 60
        - formula: SmFe9Ti3      # everything unset -> defaults below
          z: [1, 2]
        - formula: Sm2Fe14Ti3
          z: [1, 1]
      from_file: inputs/compositions.csv   # formula[,z_min,z_max,n_structures]; relative to this file

    defaults:
      z:
        min: 1
        max: 2
      max_atoms: 60              # a chosen formula is worth a bigger cell than a swept one
      n_structures:
        mode: per_atom           # per_atom | fixed  (fixed takes `count: N` instead)
        structures_per_atom: 3.0
      n_structures_scope: per_z  # per_z | total

# ---------------------------------------------------------------------------
# GENERATE -- MatterGen, conditioned on each formula
# ---------------------------------------------------------------------------
generate:
  engine: mattergen              # the only engine implemented
  mattergen:
    model: /projects/mmi/shuo/MatterGen_checkpoints/18-55-08
    mode: csp                    # csp | unconditional  -- csp is the point of naming formulas
    max_batch_size: 100          # structures per forward pass; lower it on GPU OOM
    timeout_per_batch: 1800      # seconds
  resources:
    role: gpu                    # gpu | cpu | bigmem | short | short_gpu  (roles in machine.yaml)
    gpus: 1
    time: "12:00:00"

# ---------------------------------------------------------------------------
# SCREEN + DEDUP
# ---------------------------------------------------------------------------
screen:
  mlip: mattersim                # mattersim | chgnet
  mattersim:
    model: MatterSim-v1.0.0-5M.pth
    fmax: 0.01                   # eV/A force convergence
    max_steps: 800               # more than a sweep's 500: a short list can afford it
  dedup:
    matcher:                     # loosen to merge harder; tighten to keep polymorphs apart
      ltol: 0.2
      stol: 0.2
      angle_tol: 5.0
  resources:
    role: gpu                    # gpu | cpu | bigmem | short | short_gpu
    gpus: 1
    time: "12:00:00"

# ---------------------------------------------------------------------------
# REFERENCE -- the convex hull the candidates are measured against
# ---------------------------------------------------------------------------
reference:
  thermo_type: GGA_GGA+U         # GGA_GGA+U | R2SCAN | GGA_GGA+U_R2SCAN  -- PINNED
  energy_scale: raw              # raw | mp_corrected
  mode: recompute                # recompute | mp_energies  -- asked by `csp init`
  energy_source: dft             # dft | mlip | mp  -- which store energy builds the FINAL hull

# ---------------------------------------------------------------------------
# FILTER -- who is worth a VASP job
# ---------------------------------------------------------------------------
filter:
  e_above_hull_max: 0.05         # tighter than a sweep: you want the right polymorph now
  max_per_composition: 10        # higher than a sweep: each composition IS the question
  spacegroup:
    min_number: 3                # 1 keeps everything; 3 drops P1 and P-1

# ---------------------------------------------------------------------------
# DFT -- the expensive half. INCAR tags and k-points are in recipe.yaml.
# ---------------------------------------------------------------------------
dft:
  recipe: recipe.yaml            # this folder's copy | magnets | any path
  layout: runs                   # runs | stages  (stages only for pre-2026-09-14 campaigns)
  combined_job: true             # true | false  -- every step of a structure in one job
  potcar:
    tree: VASP6.4                # VASP6.4 | VASP5.2
    functional: PBE_64           # the label matching the tree, e.g. PBE_54 for VASP5.2
    overrides: {}                # several: {Sm: Sm_3, Ti: Ti_pv} -- element -> POTCAR symbol
  rare_earth:
    f_treatment: frozen          # frozen | valence  (valence needs ldau)
    magnetic_order: ferro        # ferro | ferri | none  -- ferro matches the shared store
    reconstruct_ms: true         # true | false  -- add the frozen 4f moment back when reporting
  # The magnetic setup is part of the DFT policy the shared reference store was
  # computed with. Change any line below and this campaign's energies no longer
  # sit on the store's hull -- `csp doctor` warns ("reference recipe").
  magnetism:
    mode: ferromagnetic          # ferromagnetic | ferrimagnetic_retm | table | pymatgen | none
    strict: true                 # true | false  -- fail rather than take a default MAGMOM
    table:                       # several: element -> initial moment (muB), added to the mode's table
      As: 0.6                    # the store's own additions: elements its table
      Sb: 0.6                    # lacked, which strict: true would otherwise refuse
      Bi: 0.6
      Au: 0.6
      Ru: 3.0
      In: 0.6
      Se: 0.6
      Te: 0.6
  ldau:
    enabled: false               # true | false
    ldau_type: 2                 # 1 | 2 | 4
    u: {}                        # several: {Sm: 6.0, Nd: 6.0} -- element -> U in eV
    j: {}                        # several: {Sm: 0.0, Nd: 0.0} -- element -> J in eV
  nbands: auto                   # auto, or an integer
  incar_overrides: {}            # several: {NCORE: 8, LREAL: Auto} -- on top of every recipe step
  max_in_flight: 50              # jobs queued at once
  max_concurrent_tasks: 50       # array tasks running at once
  max_cores: 3200                # cores queued + running; 3200 = 50 jobs x 64 ranks. null = no cap
  select:
    rank_by: e_above_hull_mlip   # the order Phase B spends the budget in
    max_total: 5000              # LIFETIME ceiling on DFT jobs
