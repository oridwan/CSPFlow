# ===========================================================================
#  EXAMPLE 1 of 3 -- campaign type 1: chemical_space
#
#  "Search a region of the periodic table."  You name element groups and how
#  many elements to take from each; cspflow assembles every chemical system
#  the rules allow, enumerates the formulas inside each one, and generates
#  structures for all of them.
#
#  This is the type with a size multiplier hiding in it. The sweep below is
#  36 ternary systems / 3,384 compositions / 165,456 structures -- check it
#  with `csp source --dry-run` BEFORE you run anything.
#
#  Start your own from this file:   csp init 1 my-sweep
#
#  How to read it: every line that is not a comment is a live setting, written
#  out even where it equals the default. Where a setting takes one of a fixed
#  set of values, the others are listed beside it as  # a | b | c  (pick ONE).
#  Where a setting takes SEVERAL at once, the comment starts  # several:
#  and shows the comma-separated form, e.g.  [Sm, Nd, Pr]  or  {Sm: Sm_3, Ti: Ti_pv}.
# ===========================================================================

name: example-sweep
machine: machine.yaml            # this folder's copy | orion | generic_slurm | local | any path
workdir: results                 # beside this file; an absolute path puts output elsewhere

# ---------------------------------------------------------------------------
# SOURCE -- what to search
# ---------------------------------------------------------------------------
source:
  - mode: chemical_space         # this file's type; `csp init 1|2|3` starts another
    name: sweep                  # stamped on every row; needed once there are 2+ sources
    chemical_space:
      # Each group is a pool plus how many elements to take from it. Group
      # names (A/B/C) are labels only -- call them RE/TM/X if you prefer.
      groups:                    # several: one named group per block (A, B, C, ...)
        A:                       # rare earths
          elements: [Sm, Tb]     # several: [Sm, Nd, Pr, ...] -- the pool for this group
          pick: 1                # one number, or several: [1, 2] takes 1 AND 2 from this group
        B:                       # the magnetic transition metals
          elements: [Fe, Co, Ni]  # several: comma-separated element symbols
          pick: 1
          min_fraction: 0.75     # of the reduced formula; a magnet is mostly Fe
        C:                       # stabilisers / substituents
          elements: [Ti, V, Cr, Mn, Cu, Zn]   # several: comma-separated element symbols
          pick: 1
      max_atoms_formula: 20      # cap on the REDUCED formula (Sm2Fe17 = 19); the main size dial
      max_rare_earth: 1          # RE species per system; null = no limit

    defaults:                    # applied to every composition the sweep produces
      z:
        min: 1                   # formula units of the reduced formula
        max: 2                   # Sm2Fe17 at z=2 is a 38-atom cell
      max_atoms: 40              # z * atoms-per-formula; an over-cap z is dropped, not shrunk
      n_structures:
        mode: per_atom           # per_atom | fixed  (fixed takes `count: N` instead)
        structures_per_atom: 2.0  # 20-atom cell -> 40 structures
      n_structures_scope: per_z  # per_z | total

# ---------------------------------------------------------------------------
# GENERATE -- MatterGen, one job per composition batch
# ---------------------------------------------------------------------------
generate:
  engine: mattergen              # the only engine implemented
  mattergen:
    model: /projects/mmi/shuo/MatterGen_checkpoints/18-55-08
    mode: csp                    # csp | unconditional
    max_batch_size: 100          # structures per forward pass; lower it on GPU OOM
    timeout_per_batch: 1800      # seconds
  resources:
    role: gpu                    # gpu | cpu | bigmem | short | short_gpu  (roles in machine.yaml)
    gpus: 1
    time: "24:00:00"

# ---------------------------------------------------------------------------
# SCREEN + DEDUP -- MLIP relaxation, then discard duplicates
# ---------------------------------------------------------------------------
screen:
  mlip: mattersim                # mattersim | chgnet
  mattersim:
    model: MatterSim-v1.0.0-5M.pth
    fmax: 0.01                   # eV/A force convergence
    max_steps: 500               # a cell still moving here is kept and marked
  dedup:
    matcher:                     # pymatgen StructureMatcher tolerances
      ltol: 0.2                  # fractional length
      stol: 0.2                  # site displacement
      angle_tol: 5.0             # degrees
  resources:
    role: gpu                    # gpu | cpu | bigmem | short | short_gpu
    gpus: 1
    time: "24:00:00"

# ---------------------------------------------------------------------------
# REFERENCE -- the convex hull the candidates are measured against
# ---------------------------------------------------------------------------
reference:
  thermo_type: GGA_GGA+U         # GGA_GGA+U | R2SCAN | GGA_GGA+U_R2SCAN  -- PINNED
  energy_scale: raw              # raw | mp_corrected
  mode: recompute                # recompute | mp_energies  -- asked by `csp init`
  energy_source: dft             # dft | mlip | mp  -- which store energy builds the FINAL hull

# ---------------------------------------------------------------------------
# FILTER -- who is worth a VASP job
# ---------------------------------------------------------------------------
filter:
  e_above_hull_max: 0.10         # eV/atom on the MLIP hull; sets Phase B's size
  max_per_composition: 5         # keeps one prolific composition from filling the queue
  spacegroup:
    min_number: 1                # 1 keeps everything; 3 drops P1 and P-1

# ---------------------------------------------------------------------------
# DFT -- the expensive half. INCAR tags and k-points are in recipe.yaml.
# ---------------------------------------------------------------------------
dft:
  recipe: recipe.yaml            # this folder's copy | magnets | any path
  layout: runs                   # runs | stages  (stages only for pre-2026-09-14 campaigns)
  combined_job: true             # true | false  -- every step of a structure in one job
  potcar:
    tree: VASP6.4                # VASP6.4 | VASP5.2
    functional: PBE_64           # the label matching the tree, e.g. PBE_54 for VASP5.2
    overrides: {}                # several: {Sm: Sm_3, Ti: Ti_pv} -- element -> POTCAR symbol
  rare_earth:
    f_treatment: frozen          # frozen | valence  (valence needs ldau)
    magnetic_order: ferri        # ferri | ferro | none
    reconstruct_ms: true         # true | false  -- add the frozen 4f moment back when reporting
  magnetism:
    mode: ferrimagnetic_retm     # ferrimagnetic_retm | ferromagnetic | table | pymatgen | none
    strict: true                 # true | false  -- fail rather than take a default MAGMOM
  ldau:
    enabled: false               # true | false
    ldau_type: 2                 # 1 | 2 | 4
    u: {}                        # several: {Sm: 6.0, Nd: 6.0} -- element -> U in eV
    j: {}                        # several: {Sm: 0.0, Nd: 0.0} -- element -> J in eV
  nbands: auto                   # auto, or an integer
  incar_overrides: {}            # several: {NCORE: 8, LREAL: Auto} -- on top of every recipe step
  max_in_flight: 200             # jobs queued at once
  max_concurrent_tasks: 48       # array tasks running at once
  max_cores: 3200                # cores queued + running for this campaign; null = no cap
  select:
    rank_by: e_above_hull_mlip   # the order Phase B spends the budget in
    max_total: 1500              # LIFETIME ceiling on DFT jobs
